name: Asset attribution

# When a PR adds art/audio/font/model/shader files, open TWO resolvable review
# threads — an author sign-off and a reviewer sign-off — each listing the added
# files. The job always succeeds; it never turns the pipeline red. Merging is
# gated by branch protection's "Require conversation resolution before merging":
# both threads must be resolved before the PR can merge.
#
# GitHub can't force a *specific* person to resolve a thread, so the two threads
# are a labelled convention, backed by the required approving review (an author
# can't approve their own PR). It never checks whether docs/CREDITS.md changed —
# whether an asset needs crediting is a human call.

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  attribution:
    name: Asset attribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find newly added assets
        id: scan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Roots whose newly-added files need a sign-off. Keep in sync with the
          # tables in docs/CREDITS.md.
          ASSET_ROOTS='^(assets/sprites/|assets/audio/|assets/models/|assets/fonts/|assets/shaders/|raw/)'

          # Files this PR ADDS (status A) under those roots, minus Godot sidecars
          # (.import/.uid) and .gitkeep placeholders.
          added=$(git diff --diff-filter=A --name-only "$BASE_SHA...$HEAD_SHA" \
            | grep -E "$ASSET_ROOTS" \
            | grep -Ev '\.(import|uid)$' \
            | grep -v '/\.gitkeep$' || true)

          {
            echo "added<<EOF"
            echo "$added"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          [ -n "$added" ] && echo "has_assets=true" >> "$GITHUB_OUTPUT" \
                          || echo "has_assets=false" >> "$GITHUB_OUTPUT"

      - name: Open or update the author + reviewer sign-off threads
        uses: actions/github-script@v7
        env:
          HAS_ASSETS: ${{ steps.scan.outputs.has_assets }}
          ADDED: ${{ steps.scan.outputs.added }}
        with:
          script: |
            const creditsUrl =
              'https://github.com/JohnStegmaier/CO2unt-DO2wn/blob/master/docs/CREDITS.md';
            const hasAssets = process.env.HAS_ASSETS === 'true';
            const added = (process.env.ADDED || '').split('\n').filter(Boolean);

            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const commit_id = context.payload.pull_request.head.sha;

            // A signature of the current asset set, hidden in each comment, so a
            // real change is told apart from a harmless re-run — we never clobber
            // a human's "Resolved" without cause.
            const signature = added.slice().sort().join('|');
            const list = added.map(f => `- \`${f}\``).join('\n');

            const roles = [
              {
                marker: '<!-- asset-attribution-author -->',
                body:
                  `<!-- asset-attribution-author -->\n<!-- assets:${signature} -->\n`
                  + `**Author sign-off** ✍️\n\n`
                  + `This PR adds:\n\n${list}\n\n`
                  + `Credit anything third-party in [\`docs/CREDITS.md\`](${creditsUrl}); `
                  + `leave work you made yourself as-is. Resolve this conversation once it's handled.`,
              },
              {
                marker: '<!-- asset-attribution-reviewer -->',
                body:
                  `<!-- asset-attribution-reviewer -->\n<!-- assets:${signature} -->\n`
                  + `**Reviewer sign-off** 🔍\n\n`
                  + `Whoever reviews this PR: check the files above against `
                  + `[\`docs/CREDITS.md\`](${creditsUrl}) and resolve this once the attribution looks right.`,
              },
            ];

            // Fetch all review threads once, with each thread's first comment.
            const query = `
              query($owner:String!, $repo:String!, $pr:Int!) {
                repository(owner:$owner, name:$repo) {
                  pullRequest(number:$pr) {
                    reviewThreads(first:100) {
                      nodes {
                        id
                        isResolved
                        comments(first:1) { nodes { databaseId body } }
                      }
                    }
                  }
                }
              }`;
            const data = await github.graphql(query, { owner, repo, pr: pull_number });
            const threads = data.repository.pullRequest.reviewThreads.nodes;

            // GITHUB_TOKEN can create/update review comments but can't resolve
            // or unresolve threads (those GraphQL mutations return "Resource not
            // accessible by integration"). So we never touch a thread's resolved
            // state — a resolved-but-stale thread is replaced by a brand-new one.
            const sigOf = t =>
              (t.comments.nodes[0].body.match(/<!-- assets:(.*?) -->/) || [])[1];

            for (const role of roles) {
              if (!hasAssets) {
                // No assets remain in the PR. We can't resolve the thread here,
                // so a human resolves it once it's clearly moot.
                continue;
              }

              const matching = threads.filter(
                t => t.comments.nodes[0] && t.comments.nodes[0].body.includes(role.marker));
              const open = matching.find(t => !t.isResolved);

              if (open) {
                // A live thread is already blocking the merge. Keep its file list
                // current if the asset set changed, but leave it open — never
                // clobber how the humans left it.
                if (sigOf(open) !== signature) {
                  await github.rest.pulls.updateReviewComment({
                    owner, repo,
                    comment_id: open.comments.nodes[0].databaseId, body: role.body,
                  });
                }
              } else if (!matching.some(t => sigOf(t) === signature)) {
                // No open thread, and nobody has signed off on this exact asset
                // set yet — first run, or every existing thread was resolved for a
                // different set. Post a fresh thread instead of re-opening one.
                await github.rest.pulls.createReviewComment({
                  owner, repo, pull_number, commit_id,
                  path: added[0], subject_type: 'file', body: role.body,
                });
              }
              // else: a resolved thread already covers this exact set — leave it
              // signed off.
            }
