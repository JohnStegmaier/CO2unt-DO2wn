name: Asset attribution

# When a PR adds art/audio/font/model/shader files, post ONE resolvable review
# thread listing them. The job always succeeds — it never turns the pipeline
# red. Merging is gated by the branch-protection rule "Require conversation
# resolution before merging": the thread stays open until a human clicks
# "Resolve conversation", which is the deliberate attribution sign-off.
#
# It deliberately does NOT check whether docs/CREDITS.md changed. Some assets
# are third-party (credit them), some are original work (no credit needed) —
# that judgement belongs to the person who clicks Resolve, not to CI.

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  attribution:
    name: Asset attribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find newly added assets
        id: scan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Roots whose newly-added files need a sign-off. Keep in sync with the
          # tables in docs/CREDITS.md.
          ASSET_ROOTS='^(assets/sprites/|assets/audio/|assets/models/|assets/fonts/|assets/shaders/|raw/)'

          # Files this PR ADDS (status A) under those roots, minus Godot sidecars
          # (.import/.uid) and .gitkeep placeholders.
          added=$(git diff --diff-filter=A --name-only "$BASE_SHA...$HEAD_SHA" \
            | grep -E "$ASSET_ROOTS" \
            | grep -Ev '\.(import|uid)$' \
            | grep -v '/\.gitkeep$' || true)

          {
            echo "added<<EOF"
            echo "$added"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          [ -n "$added" ] && echo "has_assets=true" >> "$GITHUB_OUTPUT" \
                          || echo "has_assets=false" >> "$GITHUB_OUTPUT"

      - name: Post or update the resolvable attribution thread
        uses: actions/github-script@v7
        env:
          HAS_ASSETS: ${{ steps.scan.outputs.has_assets }}
          ADDED: ${{ steps.scan.outputs.added }}
        with:
          script: |
            const marker = '<!-- asset-attribution-bot -->';
            const creditsUrl =
              'https://github.com/JohnStegmaier/CO2unt-DO2wn/blob/master/docs/CREDITS.md';
            const hasAssets = process.env.HAS_ASSETS === 'true';
            const added = (process.env.ADDED || '').split('\n').filter(Boolean);

            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const commit_id = context.payload.pull_request.head.sha;

            // A signature of the current asset set, embedded (hidden) in the
            // comment. Lets us tell a real change from a harmless re-run, so we
            // never clobber a human's "Resolved" state without cause.
            const signature = added.slice().sort().join('|');

            const buildBody = () => {
              const list = added.map(f => `- \`${f}\``).join('\n');
              return `${marker}\n<!-- assets:${signature} -->\n`
                + `### Asset attribution — please confirm\n\n`
                + `This PR adds the following asset file(s):\n\n${list}\n\n`
                + `For each one, confirm it is **either** credited in `
                + `[\`docs/CREDITS.md\`](${creditsUrl}) (author, source, license) `
                + `**or** original work that needs no attribution — then click `
                + `**Resolve conversation** to unblock the merge.\n\n`
                + `_This is a human sign-off; the check never inspects the `
                + `credits file and never fails the build._`;
            };

            // Look up our existing review thread (if any) and its state.
            const query = `
              query($owner:String!, $repo:String!, $pr:Int!) {
                repository(owner:$owner, name:$repo) {
                  pullRequest(number:$pr) {
                    reviewThreads(first:100) {
                      nodes {
                        id
                        isResolved
                        comments(first:1) { nodes { databaseId body } }
                      }
                    }
                  }
                }
              }`;
            const data = await github.graphql(query, { owner, repo, pr: pull_number });
            const threads = data.repository.pullRequest.reviewThreads.nodes;
            const mine = threads.find(
              t => t.comments.nodes[0] && t.comments.nodes[0].body.includes(marker));

            const resolve = id => github.graphql(
              `mutation($id:ID!){ resolveReviewThread(input:{threadId:$id}){ thread { id } } }`,
              { id });
            const unresolve = id => github.graphql(
              `mutation($id:ID!){ unresolveReviewThread(input:{threadId:$id}){ thread { id } } }`,
              { id });
            const currentSig = mine
              ? (mine.comments.nodes[0].body.match(/<!-- assets:(.*?) -->/) || [])[1]
              : null;

            if (hasAssets) {
              if (!mine) {
                // New file-level thread anchored to the first added file.
                await github.rest.pulls.createReviewComment({
                  owner, repo, pull_number, commit_id,
                  path: added[0], subject_type: 'file', body: buildBody(),
                });
              } else if (currentSig !== signature) {
                // The asset set changed — refresh the list and re-open the
                // thread so the new files get a fresh sign-off.
                await github.rest.pulls.updateReviewComment({
                  owner, repo, comment_id: mine.comments.nodes[0].databaseId,
                  body: buildBody(),
                });
                if (mine.isResolved) await unresolve(mine.id);
              }
              // Same asset set as last run: leave the thread (and its
              // resolved/unresolved state) exactly as the humans left it.
            } else if (mine && !mine.isResolved) {
              // No assets remain in the PR — stop blocking.
              await resolve(mine.id);
            }
