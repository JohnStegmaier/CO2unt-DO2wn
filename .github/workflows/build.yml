name: Build & Deploy

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.1"

jobs:
  export:
    name: Export ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            preset: Linux
            output: build/linux/Count-Down.x86_64
            dir: build/linux
          - name: Windows
            preset: Windows Desktop
            output: build/windows/Count-Down.exe
            dir: build/windows
          - name: macOS
            preset: macOS
            output: build/macos/Count-Down.zip
            dir: build/macos
          - name: Web
            preset: Web
            output: build/web/index.html
            dir: build/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Godot binary and export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot and export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          BASE_URL="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "${BASE_URL}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "${BASE_URL}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p ~/godot-bin ~/.local/share/godot/export_templates
          unzip -q godot.zip -d ~/godot-bin
          mv ~/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot-bin/godot
          unzip -q templates.tpz -d ~/.local/share/godot/export_templates
          mv ~/.local/share/godot/export_templates/templates \
             ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Add Godot to PATH
        run: echo "$HOME/godot-bin" >> "$GITHUB_PATH"

      - name: Import project resources
        run: godot --headless --import

      - name: Export ${{ matrix.name }}
        run: |
          mkdir -p "${{ matrix.dir }}"
          godot --headless --export-release "${{ matrix.preset }}" "${{ matrix.output }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Count-Down-${{ matrix.name }}
          path: ${{ matrix.dir }}
          if-no-files-found: error

  deploy-web:
    name: Deploy web build to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: export
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: Count-Down-Web
          path: web

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Attach builds to GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: export
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package artifacts
        run: |
          cd artifacts
          find . -name '*.x86_64' -exec chmod +x {} \;
          # macOS export is already a zip; just rename it
          mv Count-Down-macOS/Count-Down.zip Count-Down-macOS.zip
          for d in Count-Down-Linux Count-Down-Windows Count-Down-Web; do
            (cd "$d" && zip -qr "../$d.zip" .)
          done

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
