; Start the run in the Basement, with air enough to stay in it.
;
; The last room of the game is behind five floors and a boss, which makes it the
; one room nobody iterates on: every look at it costs six elevator rides. This
; drops you straight into the arrival cell, one doorway from the board room.
;
; What it is for: the two-room layout, the wipe into a room twice as long as a
; normal one, the camera panning up it, the table and the chairs, six men in
; suits at their seats, and the ending firing when the last of them falls.
;
; What it CANNOT tell you: whether floor 1's exit is properly sealed, or whether
; the lift plate reads B on the way down — both of those are about arriving here
; rather than being here. Use tiny_floor and descend for real.
