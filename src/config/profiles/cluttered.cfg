; Every room furnished to the rafters, in every kind of room that has a floor.
; For the things solid props can break that an empty room cannot: a doorway
; walled off, a pickup dropped somewhere unreachable, an enemy spawned inside a
; barrel, or a chaser grinding against one instead of coming at you.
;
; Six is the ceiling, not an arbitrary big number — ObstaclePlacement lays a 3x2
; grid and puts at most one prop in a cell, because one-per-cell is what keeps
; two of them from ever closing to less than a body's width. Asking for more than
; six gets you six. See obstacle_placement.gd.
;
; room_kinds is a bitmask over RoomData.Kind: normal 1, spawn 2, boss 4, shop 8,
; treasure 16, exit 32. 55 is everything except shop, which is a side-on scene
; with no top-down floor to scatter across. The exit room is in the mask and
; still comes up bare — ElevatorRoom.obstacle_rect refuses on its own behalf,
; which is the point of ticking it here.
;
; Pair it with swarm to put a crowd and the furniture in the same room:
;
;     godot -- --profile=cluttered

[meta]
order = 65
summary = "Rooms packed with props — placement, doorways, drops and pathing."

[obstacles]
count_min = 5
count_max = 6
room_kinds = 55
