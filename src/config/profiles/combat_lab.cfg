; A small arena that is always full: six rooms, a crowd in each, and enough air
; that the run will not end while you tune a fight.
;
; Note what is deliberately NOT switched off. Damage still comes off the clock
; and the magazine still runs dry, because those are the things you are here to
; feel — god_mode would hide exactly the numbers being tuned. It is a long
; countdown rather than drain = false for the same reason: a hit still visibly
; costs you seconds, you just have thousands of them.
;
;     godot -- --profile=combat_lab

