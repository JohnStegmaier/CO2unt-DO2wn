; Runs the coin-economy drop table instead of the shipped one — the third of the
; three candidate economies in docs/DROPS.md, as far as the current item set
; reaches. Money in every room, everything else earned.
;
; Nothing else is switched off. Air still drains, enemies still shoot and the
; floor is the usual size, because what you are here to judge is whether the
; economy feels right while the rest of the game behaves normally. Pair it with
; combat_lab by hand if you want a fight to test it in.
;
;     godot -- --profile=drops_economy

[meta]
order = 75
summary = "Coin-heavy drop tables — for A/B-ing the economy against the default."

[drops]
config = "economy"
