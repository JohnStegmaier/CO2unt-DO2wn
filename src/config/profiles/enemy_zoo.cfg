; Every archetype at once, in a room full of things to hide behind. The profile
; you launch to look at the AI rather than to play.
;
; What to watch for, one per archetype:
;   booger  leans around a barrel instead of grinding into it, and dissolves the
;           one it corners you against
;   guard   breaks line of sight, holds fire while it is behind cover, and comes
;           back out to shoot
;   licker  telegraphs, commits, and cannot steer out of it — duck behind a crate
;           and it hits the crate
;   turret  sits against a wall and sweeps, ignoring you entirely
;
; Nine to twelve enemies is what makes the turret show up reliably: it is the
; rarest row in the bestiary at roughly one pick in nine, so a room of three
; usually has none. Obstacles are turned up for the same reason — the steering is
; the thing being looked at, and an empty room cannot show it.
;
; There is deliberately no bestiary of its own here. EnemyDef.weight lives on the
; def, and the defs are shared by reference, so a second EnemySet pointing at the
; same four files would be a byte-for-byte copy of the shipped one. Raising the
; count is what surfaces every archetype; see docs/ENEMIES.md to swap the roster
; properly.
;
;     godot -- --profile=enemy_zoo

[meta]
order = 62
summary = "9-12 enemies, every archetype, cluttered rooms — for watching the AI."

[enemies]
min = 9
max = 12

[obstacles]
count_min = 4
count_max = 6
