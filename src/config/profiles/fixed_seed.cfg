; The same run every launch — same rooms, same doors, same specials, same enemy
; placement, floor after floor. This is the one that turns "it happened once"
; into a bug you can walk back to.
;
; The number itself means nothing; any non-zero value pins a run. Swap in the
; seed the Output panel printed for a floor you want back — game.gd logs it on
; every floor as `run seed <n>`.
;
; Rooms are stocked as you reach them, so a different route through the same
; floor still draws different enemies. Retrace your steps to reproduce a fight.
;
;     godot -- --profile=fixed_seed

[meta]
order = 50
summary = "Pins the run seed: identical floors every launch."

[floor]
run_seed = 424242
