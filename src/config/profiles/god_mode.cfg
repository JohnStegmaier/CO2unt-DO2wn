; Nothing can stop you: the clock never runs, hits cost nothing, and the gun
; never empties. For working on anything that is not the difficulty — walking a
; floor to look at generation, chasing a door bug, showing the game to someone —
; without a fight or a countdown interrupting.
;
; Enemies still spawn and still shoot. If you want them gone too, that is
; peaceful.
;
;     godot -- --profile=god_mode

[meta]
order = 10
summary = "Unlimited air, health and ammo. Enemies still spawn."

[oxygen]
; Stops the tank emptying AND stops damage coming off it — the two are the same
; number in this game, so both fall out of one flag. See o_2_timer.gd.
