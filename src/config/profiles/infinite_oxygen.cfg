; Effectively unlimited air, for when you are testing something that is not the
; clock — room generation, enemy behaviour, doors — and do not want to die in
; the middle of it.
;
; Not literally infinite: it is 24 hours of air, and damage still costs seconds
; off it. If you need a real god mode, that wants a flag in the timer rather
; than a big number here.
