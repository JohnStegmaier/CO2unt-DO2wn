; A six-room floor with the exit two rooms from spawn, so descending is seconds
; of walking instead of most of a run. For anything that only happens between
; floors: the elevator ride, the O2 refill, floor numbering, the seed advancing.
;
; The depth rules come down with the size on purpose. The generator refuses a
; layout whose exit is shallower than exit_min_depth and rerolls 40 times before
; warning and relaxing them, so leaving the shipped 3 here would spend 40
; attempts printing a warning on every single floor.
;
; rooms_per_floor = 0 holds the size flat as you descend — a floor that grows by
; two rooms a time stops being a tiny floor after a few rides down.
;
;     godot -- --profile=tiny_floor

[meta]
order = 40
summary = "Six-room floors, exit two rooms away — for testing the descent."

[floor]
rooms_min = 6
rooms_max = 6
rooms_per_floor = 0
max_depth = 2
exit_min_depth = 2
special_min_depth = 1
