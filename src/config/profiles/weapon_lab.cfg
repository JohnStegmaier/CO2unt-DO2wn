; Everything you need to feel a weapon, in one room after another: a crowd to
; shoot at, furniture to break weapons out of, air enough that the run will not
; end mid-tuning, and a purse that can afford the shop's shelf.
;
; Note what is deliberately NOT switched off, for the same reason combat_lab
; leaves them on: the magazine still runs dry, the reload still costs you, and a
; hit still comes off the clock. Those are the things a weapon IS — a shotgun
; with infinite_ammo is just a gun that fires five bullets, and its whole bargain
; is that you get two shots and then you are reloading.
;
; Weapons come out of crates and barrels, so the obstacle count is the point
; rather than set dressing: an empty room drops nothing. room_kinds 55 is
; everything except the shop, which is a side-on scene with no floor to scatter
; across — see cluttered.cfg for what that mask means.
;
; starting_coins clears the chakram on the shop shelf at 40 with room to spare,
; so the "buy a weapon" path can be walked without farming for it first.
;
;     godot -- --profile=weapon_lab
;
; See docs/WEAPONS.md and docs/TUNING_PROFILES.md.

[meta]
order = 72
summary = "Crowds, breakable props and a full purse — for feeling weapons."

[enemies]
min = 6
max = 10

[oxygen]
total_time = 86400.0

[obstacles]
count_min = 5
count_max = 6
room_kinds = 55

[shop]
starting_coins = 200

[floor]
rooms_min = 8
rooms_max = 8
rooms_per_floor = 0
max_depth = 2
exit_min_depth = 2
special_min_depth = 1
